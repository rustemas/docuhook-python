[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docuhook-client"
version = "1.0.0"
description = "Official DocuHook Python client — merge JSON into HTML templates via the DocuHook API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DocuHook" }]
keywords = ["docuhook", "pdf", "webhook", "html", "template"]
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://docuhook.com"
Repository = "https://github.com/rustemas/docuhook-python"
Issues = "https://github.com/rustemas/docuhook-python/issues"

[tool.setuptools.packages.find]
include = ["docuhook*"]
